appId: com.gpflow.desktop
productName: GP Flow
directories:
  output: release

# Icons: add assets/icon.ico (Windows) and assets/icon.icns (macOS) and uncomment
# the `icon:` lines below. electron-builder falls back to its default icon otherwise.
win:
  target: nsis
  # icon: assets/icon.ico
  forceCodeSigning: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target: dmg
  # icon: assets/icon.icns
  category: public.app-category.healthcare-fitness

# Only the built main process, the static renderer, and production dependencies
# (electron-builder adds `dependencies` automatically; never list node_modules/**/* here,
# that drags every devDependency into the installer).
files:
  - dist-electron/**/*
  - out/**/*
  - "!node_modules/.cache"

# Chromium for Playwright. `pnpm bundle:browsers` downloads it into playwright-browsers/;
# electron/bootstrap-env.ts points PLAYWRIGHT_BROWSERS_PATH at <resources>/browsers when packaged.
# The runner launches a headed browser, so the headless shell and ffmpeg (video only) are left out.
extraResources:
  - from: playwright-browsers/
    to: browsers/
    filter:
      - "chromium-*/**"
      - "winldd-*/**"

asar: true
